<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sites Clientes</title><style>
:root{color-scheme:dark;--bg:#090b12;--card:#151a29;--line:#2a3145;--muted:#a5afc5;--accent:#8b5cf6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 0,#2b1555 0,transparent 32rem),var(--bg);color:#f7f8ff}header{padding:34px clamp(20px,6vw,88px);border-bottom:1px solid var(--line)}.eyebrow{color:#c3aaff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(34px,6vw,68px);margin:6px 0}header p{color:var(--muted);margin:0}main{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 150px)}aside{padding:22px;border-right:1px solid var(--line)}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#121727;color:white;font:inherit}.list{display:grid;gap:7px;margin-top:16px}.item{padding:13px;border:1px solid transparent;border-radius:10px;background:transparent;color:#fff;text-align:left;font:inherit;cursor:pointer}.item:hover,.item.active{background:#1d2234;border-color:#4c3e77}.item small{display:block;color:var(--muted);margin-top:3px}section{display:grid;place-items:center;padding:30px}article{max-width:730px;width:100%;padding:clamp(26px,5vw,58px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#191e30,#111520);box-shadow:0 24px 80px #0008}.count{color:#c3aaff;font-weight:800}h2{font-size:clamp(30px,5vw,52px);margin:8px 0}#desc{color:var(--muted);line-height:1.65;min-height:52px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}a,button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#252c40;color:white;font:inherit;text-decoration:none;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}@media(max-width:720px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body><header><div class="eyebrow">Portfólio central</div><h1>Sites Clientes</h1><p>Uma playlist dos projetos reunidos no repositório.</p></header><main><aside><input id="q" placeholder="Buscar projeto…"><div class="list" id="list"></div></aside><section><article><div class="count" id="count"></div><h2 id="title"></h2><p id="desc"></p><div class="actions"><a class="primary" id="open" target="_blank" rel="noopener">Abrir arquivos</a><a id="code" target="_blank" rel="noopener">Ver código</a><button id="prev">← Anterior</button><button id="next">Próximo →</button></div></article></section></main><script>
const base='https://github.com/Wandersonpaixaomkt/Sites-Clientes/tree/main/clientes/';const all=[['eleicoes2026-candidatos','Eleições 2026 — Candidatos','Projeto de campanha e apresentação de candidaturas.'],['ferramentas-avex','Ferramentas AVEX','Coleção de ferramentas e experiências da AVEX.'],['geanekezia','Geane Kezia','Projeto de perfil profissional.'],['landpage-2-0-wands','Landing Page 2.0','Landing page e presença profissional.'],['landpage-avex-wanderson','Landing Page AVEX','Landing page da AVEX e Wanderson.'],['newsy-portal-joy','Newsy Portal Joy','Portal de notícias e conteúdo.'],['norte-em-foco-portal-noticias','Norte em Foco','Portal de notícias regional.'],['oliveiraesampaio-com-br','Oliveira & Sampaio','Site institucional de advocacia.'],['orkut-revival','Orkut Revival','Experiência inspirada na rede social.'],['perfil-profissional-ge','Perfil Profissional GE','Página de perfil profissional.']];let items=all,n=0;const $=x=>document.getElementById(x);function show(i){n=(i+items.length)%items.length;let p=items[n];$('count').textContent=String(n+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');$('title').textContent=p[1];$('desc').textContent=p[2];$('open').href=$('code').href=base+p[0];location.hash=p[0];document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.s===p[0]))}function render(){let l=$('list');l.innerHTML='';items.forEach((p,i)=>{let b=document.createElement('button');b.className='item';b.dataset.s=p[0];b.innerHTML=p[1]+'<small>'+p[0]+'</small>';b.onclick=()=>show(i);l.append(b)});if(items.length)show(0)}$('q').oninput=e=>{items=all.filter(p=>p.join(' ').toLowerCase().includes(e.target.value.toLowerCase()));render()};$('prev').onclick=()=>show(n-1);$('next').onclick=()=>show(n+1);document.onkeydown=e=>{if(e.key==='ArrowLeft')show(n-1);if(e.key==='ArrowRight')show(n+1)};render();
</script></body></html>
