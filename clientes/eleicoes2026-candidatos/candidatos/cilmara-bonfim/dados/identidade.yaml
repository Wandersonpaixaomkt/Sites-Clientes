meta:
  candidato: Cilmara Bonfim
  nome_completo: Cilmara Teixeira Bonfim Leal
  estado: Pará
  municipio_de_base: Parauapebas
  ciclo_eleitoral: 2026
  ultima_revisao: 2026-08-31
  status_geral: a_confirmar_em_fontes_oficiais

identidade_publica:
  definicao_curta: >-
    Liderança de Parauapebas ligada à inclusão, à comunidade surda,
    à Libras e aos direitos das pessoas com deficiência.
  atributos_de_comunicacao:
    - mulher surda e usuária de Libras
    - mãe e liderança comunitária
    - agente administrativa segundo fontes eleitorais consultadas
    - atuação relacionada à pauta PcD e inclusão
  tese_de_posicionamento: >-
    A voz da inclusão que saiu da vivência, construiu rede de apoio,
    participou da gestão pública e quer levar direitos concretos para o Pará.

uso_responsavel:
  - Não usar deficiência como apelo de pena ou único atributo da candidata.
  - Confirmar diretamente com a equipe nomes de associações, formação e dados biográficos detalhados.
  - Usar Libras, legendas e contraste adequado em toda comunicação pública.
