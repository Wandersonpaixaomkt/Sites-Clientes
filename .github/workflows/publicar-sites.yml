name: Publicar sites
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar sites estaticos em sites/
        run: |
          set -e
          mkdir -p /tmp/b sites
          cat > /tmp/snap.py <<'PYEOF'
          import sys, os, re, shutil, subprocess, urllib.request
          app, name, port, routes = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4].split(',')
          base = '/sites/' + name
          out = os.path.join(os.environ.get('OUT', '/tmp/out'), 'sites', name)
          client = os.path.join(app, 'dist', 'client')
          if os.path.exists(out): shutil.rmtree(out)
          shutil.copytree(client, out, ignore=shutil.ignore_patterns('_headers','sites'))
          nested = os.path.join(client, 'sites', name)
          if os.path.isdir(nested): shutil.copytree(nested, out, dirs_exist_ok=True)
          # routes
          for r in routes:
              url = 'http://localhost:%s%s%s' % (port, base, r if r != '/' else '/')
              data = urllib.request.urlopen(url).read()
              d = os.path.join(out, r.strip('/'))
              os.makedirs(d, exist_ok=True)
              open(os.path.join(d, 'index.html'), 'wb').write(data)
          # public-file prefixes
          pub = os.path.join(app, 'public')
          segs = set()
          if os.path.isdir(pub):
              for e in os.listdir(pub): segs.add(e)
          segs = sorted(segs, key=len, reverse=True)
          pat = re.compile(r'(["\'`(=,\s])/(' + '|'.join(re.escape(s) for s in segs) + r')(?=[/"\'`)\s?#.,\\])') if segs else None
          n = 0
          for root, _, files in os.walk(out):
              for f in files:
                  if not f.endswith(('.html', '.js', '.css', '.json', '.xml', '.txt', '.webmanifest', '.map')): continue
                  p = os.path.join(root, f)
                  s = open(p, encoding='utf-8', errors='surrogateescape').read()
                  t = pat.sub(lambda m: m.group(1) + base + '/' + m.group(2), s) if pat else s
                  if t != s:
                      open(p, 'w', encoding='utf-8', errors='surrogateescape').write(t); n += 1
          print('rewritten files:', n, 'segments:', segs)
          PYEOF
          export OUT="$PWD"
          build_app() {
            d=$1; port=$2; routes=$3; mode=$4
            rm -rf "/tmp/b/$d"
            cp -r "$OUT/clientes/$d" "/tmp/b/$d"
            cd "/tmp/b/$d"
            printf 'import type { NextConfig } from "next";\n\nconst nextConfig: NextConfig = {\n  basePath: "/sites/%s",\n};\n\nexport default nextConfig;\n' "$d" > next.config.ts
            npm install --no-audit --no-fund --loglevel=error
            npm run build
            if [ "$mode" = wrangler ]; then
              (nohup npx wrangler dev --config dist/server/wrangler.json --local --port "$port" > "/tmp/b/$d.log" 2>&1 &)
            else
              (nohup npx vinext start -p "$port" > "/tmp/b/$d.log" 2>&1 &)
            fi
            for i in $(seq 1 60); do curl -sf "http://localhost:$port/sites/$d/" -o /dev/null && break; sleep 2; done
            python3 /tmp/snap.py "/tmp/b/$d" "$d" "$port" "$routes"
            cd "$OUT"
          }
          build_app landpage-avex-wanderson 4101 "/,/servicos" vinext
          build_app orkut-revival 4102 "/" vinext
          build_app norte-em-foco-portal-noticias 4104 "/" wrangler
          mkdir -p sites/ferramentas-avex
          cat > sites/ferramentas-avex/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ferramentas AVEX | WhatsApp Flows</title>
          <style>
          :root{--bg:#0e0f13;--panel:#16181f;--line:#2a2e3a;--text:#eceef3;--mute:#8d93a3;--acc:#f15e22}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
          .wrap{max-width:820px;margin:0 auto;padding:48px 20px}
          .kicker{color:var(--acc);font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
          h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:8px 0 14px}
          p.lead{color:var(--mute);font-size:18px;margin:0 0 28px}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:26px 0}
          .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
          .card h3{margin:0 0 6px;font-size:16px}
          .card p{margin:0;color:var(--mute);font-size:14px}
          .note{border-left:3px solid var(--acc);background:var(--panel);padding:14px 18px;border-radius:0 12px 12px 0;color:var(--mute);font-size:14px}
          .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
          a.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px;background:var(--panel)}
          a.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
          a.btn:hover{border-color:var(--acc)}
          footer{margin-top:40px;color:var(--mute);font-size:12px}
          </style>
          </head>
          <body>
          <div class="wrap">
           <div class="kicker">AVEX Ads &middot; Ferramentas</div>
           <h1>WhatsApp Flows: endpoint de ofertas personalizadas</h1>
           <p class="lead">Colecao de ferramentas de apoio da AVEX. Esta pasta guarda uma copia de referencia do exemplo oficial <b>Personalised Offer</b>, da Meta, para criar fluxos de atendimento e recomendacao no WhatsApp.</p>
           <div class="grid">
            <div class="card"><h3>Criptografia</h3><p>Descriptografa as solicitacoes recebidas e criptografa as respostas do Flow.</p></div>
            <div class="card"><h3>Validacao de assinatura</h3><p>Validacao opcional da assinatura enviada pela Meta.</p></div>
            <div class="card"><h3>Geracao de chaves</h3><p>Script para gerar o par de chaves publica e privada.</p></div>
            <div class="card"><h3>Navegacao de telas</h3><p>Controla a passagem entre as telas do Flow e serve de base para recomendacoes personalizadas.</p></div>
           </div>
           <div class="note"><b>Nao e um site.</b> E um servidor Node.js/Express que roda no backend e responde ao WhatsApp. Por isso esta pagina so apresenta a ferramenta. O exemplo oficial e para prototipacao e nao esta pronto para producao.</div>
           <div class="btns">
            <a class="btn main" href="https://github.com/Wandersonpaixaomkt/Sites-Clientes/tree/main/clientes/ferramentas-avex" target="_blank" rel="noopener">Ver codigo</a>
            <a class="btn" href="https://developers.facebook.com/docs/whatsapp/flows/gettingstarted/personalised-offer" target="_blank" rel="noopener">Documentacao da Meta</a>
            <a class="btn" href="https://github.com/WhatsApp/WhatsApp-Flows-Tools" target="_blank" rel="noopener">Repositorio oficial</a>
           </div>
           <footer>Codigo de origem sob licenca MIT, copyright Meta Platforms, Inc. and affiliates.</footer>
          </div>
          </body>
          </html>
          HTMLEOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sites
          git commit -m "Publica sites estaticos em sites/" || echo "sem mudancas"
          git push
